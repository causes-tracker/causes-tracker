name: build
on:
  push:
    branches: [master]
  pull_request:
  merge_group:
permissions:
  contents: write
env:
  # BB_FLAGS travels with every CI bazel invocation. The --build_metadata
  # tags make BuildBuddy invocations searchable by GitHub run/PR/branch so
  # tooling can correlate BB stats back to a specific CI run without
  # having to capture per-invocation UUIDs. The literal-block scalar (|)
  # keeps each flag on its own line for readability and yamllint compliance;
  # shell word-splitting on $BB_FLAGS treats newlines as separators.
  BB_FLAGS: |
    --config=ci
    --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }}
    --build_metadata=GITHUB_RUN_ID=${{ github.run_id }}
    --build_metadata=GITHUB_RUN_ATTEMPT=${{ github.run_attempt }}
    --build_metadata=GITHUB_EVENT_NAME=${{ github.event_name }}
    --build_metadata=GITHUB_PR_NUMBER=${{ github.event.pull_request.number }}
    --build_metadata=GITHUB_BRANCH=${{ github.ref_name }}
    --build_metadata=GITHUB_JOB=${{ github.job }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      # The base image ships the deprecated gold linker, which causes warnings
      # when detected by build tools.  Remove the binaries; ld already points
      # to ld.bfd.
      - name: Remove deprecated gold linker
        run: sudo rm -f /usr/bin/x86_64-linux-gnu-ld.gold /usr/bin/ld.gold
      - name: Install Bazelisk
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86  # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-v2
          repository-cache: true
      - name: Run quality gates (lint, format, test, coverage)
        env:
          CHECK_TIMING_JSONL: ${{ github.workspace }}/check-timings.jsonl
        run: tools/check.sh ci $BB_FLAGS //...
      # Drain async BES uploads before the runner exits.
      - name: Drain BES uploads
        if: always()
        run: bazel shutdown
      - name: Upload per-gate timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: check-timings-${{ github.run_id }}
          path: check-timings.jsonl
          retention-days: 90
          if-no-files-found: warn
  # Runs on a checkout where Bazel never runs: buck2's file watcher follows the
  # bazel-* convenience symlinks into the output tree and hangs, so buck2 builds
  # cannot share a checkout with Bazel.
  buck2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 10
      # Shared by every change-detection step below (pin, renovate.json, …):
      # base/head only exist on pull_request/merge_group, and fetch-depth:
      # 10 must actually reach both — fail loud here rather than have a
      # shallow-history "unknown revision" surface later as a confusing
      # git-diff failure in whichever step happens to run first.
      - name: Determine base/head commits for change checks
        id: base_head
        run: |
          base=""
          head=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            base="${{ github.event.merge_group.base_sha }}"
            head="${{ github.event.merge_group.head_sha }}"
          fi
          if [ -n "$base" ]; then
            git cat-file -e "$base^{commit}"
            git cat-file -e "$head^{commit}"
          fi
          echo "orig_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
      # See tools/nativelink/README.md, "Changing the rootfs digest".
      - name: Check whether the rootfs digest pin changed
        id: pin_check
        run: |
          pin_changed=false
          base="${{ steps.base_head.outputs.base }}"
          head="${{ steps.base_head.outputs.head }}"
          if [ -n "$base" ] && ! git diff --quiet "$base" "$head" -- tools/nativelink/pin.bzl; then
            pin_changed=true
          fi
          echo "pin_changed=$pin_changed" >> "$GITHUB_OUTPUT"
      - name: Install buck2
        run: sudo bash tools/buck2/install.sh /usr/local/bin
      - name: Install NativeLink
        run: sudo bash tools/nativelink/install.sh /usr/local/bin
      # The buck2 launcher runs NativeLink inside a crun container built
      # from the pinned worker layer.
      - name: Install crun
        run: sudo bash tools/crun/install.sh /usr/local/bin
      # ubuntu-latest restricts unprivileged user-namespace creation by
      # default; rootless crun needs one to build its container. The
      # devcontainer instead grants this via --cap-add SYS_ADMIN + seccomp,
      # which isn't available on a hosted runner.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The buck2 launcher auto-starts NativeLink with this overlay, whose
      # stores write through to BuildBuddy (NativeLink holds the key).
      - name: Configure NativeLink BuildBuddy overlay
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
        run: |
          sed "s/YOUR_KEY_HERE/${BUILDBUDDY_API_KEY}/" \
            tools/nativelink/config-bb.json5.template > .nativelink.json5
      # Turns on the image platform's cache reads (gated on this key) and
      # lets the launcher's pre-start build fetch a blessed image from
      # BuildBuddy.
      - name: Configure buck2 BuildBuddy key
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
        run: |
          sed "s/YOUR_KEY_HERE/${BUILDBUDDY_API_KEY}/" \
            .buckconfig.local.template > .buckconfig.local
      - name: "Rootfs digest change: trigger executor start with the previous pin"
        if: steps.pin_check.outputs.pin_changed == 'true'
        run: |
          git checkout "${{ steps.base_head.outputs.base }}"
          # pin.bzl may not exist yet at base (e.g. the PR that introduces
          # it): fall back to the digest's previous location, the literal
          # worker_layer(digest = "...") in tools/nativelink/BUCK.
          if [ -f tools/nativelink/pin.bzl ]; then
            old_digest="$(grep -oP 'WORKER_LAYER_DIGEST = "\K[a-f0-9]+' tools/nativelink/pin.bzl)"
          else
            old_digest="$(grep -oP 'digest = "\K[a-f0-9]+' tools/nativelink/BUCK)"
          fi
          echo "OLD_LAYER_DIGEST=$old_digest" >> "$GITHUB_ENV"
          buck2 targets //...
      # Restores the exact commit the initial checkout put in place (the
      # PR's merge-preview commit, or the merge-queue's combined commit),
      # not head.sha directly — the rest of the job must keep testing
      # what every other run tests, not the unmerged branch tip.
      - name: "Rootfs digest change: switch to the build head"
        if: steps.pin_check.outputs.pin_changed == 'true'
        run: git checkout "${{ steps.base_head.outputs.orig_head }}"
      - name: "Rootfs digest change: validate new pin builds hermetically on the old worker"
        if: steps.pin_check.outputs.pin_changed == 'true'
        run: |
          buck2 build --remote-only \
            -c image_build.container_image="$OLD_LAYER_DIGEST" \
            '//tools/nativelink:layer[layer][digest]'
      - name: "Rootfs digest change: retire the old worker"
        if: steps.pin_check.outputs.pin_changed == 'true'
        run: |
          buck2 kill
      - name: Check whether renovate.json changed
        id: renovate_check
        run: |
          changed=false
          base="${{ steps.base_head.outputs.base }}"
          head="${{ steps.base_head.outputs.head }}"
          if [ -n "$base" ] && ! git diff --quiet "$base" "$head" -- renovate.json; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      # See tools/renovate/README.md, "functional_check (buck2)".
      - name: "renovate.json change: run functional check"
        if: steps.renovate_check.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '[renovate]\n  gh_token = %s\n' "$GITHUB_TOKEN" >> .buckconfig.local
          buck2 build //tools/renovate:functional_check
      # functional_check can't satisfy --remote-only (see tools/renovate/
      # README.md); every sweep below excludes it.
      - name: Compute --remote-only target set
        run: |
          targets="$(buck2 uquery '//... - //tools/renovate:functional_check' | tr '\n' ' ')"
          echo "REMOTE_ONLY_TARGETS=$targets" >> "$GITHUB_ENV"
      # --remote-only: CI is the trusted executor environment, so every
      # action — including the hybrid image-build platform's — runs on
      # NativeLink and warms the shared cache; nothing here executes local.
      - name: Build buck2 targets
        run: buck2 build --remote-only $REMOTE_ONLY_TARGETS
      # A rootfs pin bump reshapes the worker image; diff the built tar's
      # manifest against the base golden so review sees the member-level
      # change without depending on the author regenerating rootfs.manifest.
      - name: "Rootfs digest change: show the rootfs manifest diff"
        if: steps.pin_check.outputs.pin_changed == 'true'
        run: |
          base="${{ steps.base_head.outputs.base }}"
          git show "$base:tools/nativelink/rootfs.manifest" \
            >"$RUNNER_TEMP/base.manifest" 2>/dev/null \
            || : >"$RUNNER_TEMP/base.manifest"
          tar="$(buck2 build --show-simple-output '//tools/nativelink:layer[layer]')"
          buck2 run //third_party/python:py -- \
            tools/nativelink/rootfs_manifest.py diff \
            "$RUNNER_TEMP/base.manifest" "$tar" "$RUNNER_TEMP/manifest.diff"
          echo "::group::worker rootfs manifest change (vs base)"
          cat "$RUNNER_TEMP/manifest.diff"
          echo "::endgroup::"
      # A green cached build cannot distinguish "cache works" from
      # "permanently missing"; only a demonstrated hit proves the read path.
      # buck2 clean + kill destroys buck2's local state, so the required
      # hits prove our buck2 config round-trips through the executor's
      # cache.
      - name: Verify remote cache round-trip
        run: |
          buck2 clean
          buck2 kill
          buck2 build --remote-only $REMOTE_ONLY_TARGETS 2>&1 | tee rebuild.log
          grep -q 'Cache hits: 100%' rebuild.log
      # An action reading an undeclared repo file must fail under input
      # staging. Validates that the reference configuration exercised in
      # CI is isolating actions; it makes no claim about dev environments.
      - name: Verify undeclared inputs are invisible
        run: |
          if buck2 build probes//:undeclared_read; then
            echo "undeclared read unexpectedly succeeded" >&2
            exit 1
          fi
      - name: Show NativeLink log on failure
        if: failure()
        run: cat ~/.cache/causes-nativelink/nativelink.log || true
      - name: Shut down buck2 daemon
        if: always()
        run: |
          buck2 kill || true
          pkill -x nativelink || true
  # Metrics collection runs as a separate job depending on `build` and
  # `buck2` so that their step logs are finalized by the time `record`
  # reads them. Inside a job, the GH logs endpoint 404s on the
  # presigned Azure blob until the job ends. The whole job is best-effort
  # (`if: always()` + `continue-on-error` per step) so a metrics failure
  # never turns a green build red, and metrics still get collected when
  # the build itself failed.
  ci-metrics:
    runs-on: ubuntu-latest
    needs: [build, buck2]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Remove deprecated gold linker
        run: sudo rm -f /usr/bin/x86_64-linux-gnu-ld.gold /usr/bin/ld.gold
      - name: Install Bazelisk
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86  # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-ci-metrics
          repository-cache: true
      - name: Download per-gate timings
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: check-timings-${{ github.run_id }}
          path: ${{ github.workspace }}
      # `--out` must be absolute: `bazel run` invokes the binary with cwd
      # inside the runfiles tree, not GITHUB_WORKSPACE, so a relative path
      # lands in `~/.cache/bazel/.../ci_health.runfiles/_main/` where
      # upload-artifact can't see it.
      # `--check-timings` is the JSONL produced by `tools/check.sh` under
      # `CHECK_TIMING_JSONL` in the `build` job, downloaded above.
      - name: Record CI metrics
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
        run: |
          bazel run $BB_FLAGS //tools/ci_health -- record \
            --run-id ${{ github.run_id }} \
            --job build \
            --out "${{ github.workspace }}/ci-metrics.json" \
            --check-timings "${{ github.workspace }}/check-timings.jsonl" \
            --buck2-job buck2 \
            ${{ github.event.pull_request.number && format('--pr {0}', github.event.pull_request.number) || '' }}
      - name: Upload CI metrics artifact
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ci-metrics-${{ github.run_id }}
          path: ci-metrics.json
          retention-days: 90
          if-no-files-found: ignore
      # Posts a marked comment on the PR only if this run is materially
      # slower or has worse cache behavior than the rolling baseline.
      # Silent on healthy runs. Best-effort: never fails the build.
      - name: Comment on PR if regressed
        if: always() && github.event_name == 'pull_request' && hashFiles('ci-metrics.json') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bazel run $BB_FLAGS //tools/ci_health -- pr-comment \
            --current "${{ github.workspace }}/ci-metrics.json" \
            --baseline-window 20 \
            --pr ${{ github.event.pull_request.number }}
      - name: Drain BES uploads
        if: always()
        run: bazel shutdown
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      # The base image ships the deprecated gold linker, which causes warnings
      # when detected by build tools.  Remove the binaries; ld already points
      # to ld.bfd.
      - name: Remove deprecated gold linker
        run: sudo rm -f /usr/bin/x86_64-linux-gnu-ld.gold /usr/bin/ld.gold
      - name: Install Bazelisk
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86  # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-v2
          repository-cache: true
      - name: Deploy to GitHub Pages
        run: bazel run $BB_FLAGS //docs:deploy_docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Drain BES uploads
        if: always()
        run: bazel shutdown
