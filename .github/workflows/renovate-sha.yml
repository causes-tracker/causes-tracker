name: renovate-sha
# Renovate regex managers cannot update checksums
# (renovatebot/renovate#22183), so its installer version bumps arrive
# with a stale sha256 pin. Recompute it and push the fix back to the
# Renovate branch before CI runs, like renovate-lockfile does for
# lockfiles.
#
# The push uses AUTO_QUEUE_TOKEN (not the default GITHUB_TOKEN) because
# pushes performed with GITHUB_TOKEN do not create new workflow runs,
# which would leave the PR's checks stuck on the pre-fix commit.
# Our own fix push retriggers this workflow; the script is idempotent,
# so that run finds nothing to change and stops.
on:
  push:
    branches: ["renovate/**"]
    paths:
      - tools/buck2/install.sh
      - tools/crun/install.sh
      - tools/nativelink/install.sh
      - "**/BUCK"
      - MODULE.bazel
permissions:
  contents: write
# Shared with renovate-lockfile: fixers on the same branch run one at a
# time, and the waiter checks out by branch name, so it sees the winner's
# push instead of racing it.
concurrency:
  group: renovate-fix-${{ github.ref }}
  cancel-in-progress: false
# GitHub's default step shell (`bash -e {0}`) omits pipefail; force our own.
defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}
jobs:
  fix-sha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.AUTO_QUEUE_TOKEN }}
      # Every installer, unconditionally: an untouched pin is a no-op, so
      # diff-detection logic is unnecessary.
      - name: Recompute installer sha256 pins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash tools/renovate/update_sha.sh tools/buck2/install.sh
          bash tools/renovate/update_sha.sh tools/crun/install.sh
          bash tools/renovate/update_sha.sh tools/nativelink/install.sh
      # Each changed BUCK's or MODULE.bazel's archive pins: only a URL that
      # changed vs master is re-fetched, so an unchanged pin keeps its
      # first-seen checksum.
      - name: Recompute archive sha256 pins
        run: |
          git fetch -q --depth=1 origin master
          # Capture separately so a git failure aborts (a pipe to while would exit 0).
          changed="$(git diff --name-only FETCH_HEAD -- ':(glob)**/BUCK' MODULE.bazel)"
          while IFS= read -r pinfile; do
            [ -n "$pinfile" ] || continue
            base="$(mktemp)"
            # A pinfile new since master is absent at FETCH_HEAD; an empty base
            # then means "all pins new". Test existence structurally so any
            # other git failure still aborts.
            if git cat-file -e "FETCH_HEAD:$pinfile" 2>/dev/null; then
              git show "FETCH_HEAD:$pinfile" >"$base"
            else
              : >"$base"
            fi
            bash tools/renovate/update_archive_sha.sh "$pinfile" "$base"
          done <<<"$changed"
      - name: Push fix if the pins changed
        run: |
          rc=0
          git diff --quiet || rc=$?
          case "$rc" in
            0) exit 0 ;;
            1) ;;
            *) echo "git diff --quiet errored ($rc)" >&2; exit 1 ;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: recompute pinned sha256 checksums"
          git push
