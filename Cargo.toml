[workspace]
members = [
  "lib/rust/api_db",
  "lib/rust/causes_crypto",
  "lib/rust/causes_mcp",
  "lib/rust/db_aws",
  "lib/rust/db_connect",
  "lib/rust/db_pool",
  "lib/rust/causes_proto",
  "lib/rust/causes_session",
  "lib/rust/proto_ext",
  "services/causes_api",
  "services/causes_cli",
  "tools/ci_health",
  "tools/proto-gen",
  "tools/sqlx-cli",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.14", features = [
  "transport",
  "tls-ring",
  "tls-native-roots",
] }
tonic-health = { version = "0.14" }
sqlx = { version = "0.8", features = [
  "runtime-tokio",
  "postgres",
  "uuid",
  "chrono",
  "migrate",
] }
reqwest = { version = "0.13", features = [
  "json",
  "rustls-no-provider",
  "form",
  "query",
], default-features = false }
clap = { version = "4", features = ["env", "derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.32"
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31", features = [
  "http-proto",
  "reqwest-rustls",
] }
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }
url = "2"
email_address = "0.2"
prost = "0.14"
prost-types = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-acme = { version = "0.15", default-features = false, features = [
  "tokio",
  "ring",
  "tls12",
  "webpki-roots",
] }
futures = "0.3"
tokio-stream = "0.1"
tower = { version = "0.5", features = ["util"] }
rmcp = { version = "1", features = ["server", "transport-io", "macros"] }
schemars = "1"
mockall = "0.14"
tempfile = "3"
rcgen = "0.14"
wiremock = "0.6"
arc-swap = "1"
chrono = { version = "0.4", default-features = false, features = [
  "std",
  "serde",
  "clock",
] }
octocrab = "0.50"
# AWS SDK crates: default features enable BOTH `default-https-client` (which selects aws-smithy-http-client/rustls-aws-lc — aws-lc-rs) AND `rustls` (which selects aws-smithy-http-client/legacy-rustls-ring — old rustls 0.21).
# Both are disabled here so the workspace stays on a single rustls 0.23 + ring stack matching tonic, sqlx-cli, octocrab, causes_mcp, and rustls-acme (overridden to ring below).
# `db_aws::connect_iam` builds the HttpClient explicitly via aws-smithy-http-client with the rustls-ring feature and passes it to aws_config.
# `sso` is dropped because this codebase uses IAM auth (db_aws), not SSO.
aws-config = { version = "1", default-features = false, features = [
  "behavior-version-latest",
  "credentials-process",
  "rt-tokio",
] }
aws-credential-types = "1"
aws-sdk-rds = { version = "1", default-features = false, features = [
  "behavior-version-latest",
  "rt-tokio",
] }
aws-smithy-async = { version = "1", features = ["test-util"] }
aws-smithy-http-client = { version = "1", features = ["rustls-ring"] }
aws-types = "1"
safelog = "0.4"
