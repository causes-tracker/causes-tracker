name: build
on:
  push:
    branches: [master]
  pull_request:
  merge_group:
permissions:
  contents: write
env:
  # BB_FLAGS travels with every CI bazel invocation. The --build_metadata
  # tags make BuildBuddy invocations searchable by GitHub run/PR/branch so
  # tooling can correlate BB stats back to a specific CI run without
  # having to capture per-invocation UUIDs. The literal-block scalar (|)
  # keeps each flag on its own line for readability and yamllint compliance;
  # shell word-splitting on $BB_FLAGS treats newlines as separators.
  BB_FLAGS: |
    --config=ci
    --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }}
    --build_metadata=GITHUB_RUN_ID=${{ github.run_id }}
    --build_metadata=GITHUB_RUN_ATTEMPT=${{ github.run_attempt }}
    --build_metadata=GITHUB_EVENT_NAME=${{ github.event_name }}
    --build_metadata=GITHUB_PR_NUMBER=${{ github.event.pull_request.number }}
    --build_metadata=GITHUB_BRANCH=${{ github.ref_name }}
    --build_metadata=GITHUB_JOB=${{ github.job }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      # The base image ships the deprecated gold linker, which causes warnings
      # when detected by build tools.  Remove the binaries; ld already points
      # to ld.bfd.
      - name: Remove deprecated gold linker
        run: sudo rm -f /usr/bin/x86_64-linux-gnu-ld.gold /usr/bin/ld.gold
      - name: Install Bazelisk
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86  # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-v2
          repository-cache: true
      - name: Check Rust macro usage
        run: |
          if grep -rn 'load("@rules_rs//rs:rust_\(binary\|library\|test\)\.bzl"' --include='BUILD.bazel' .; then
            echo "ERROR: Use //build:rust.bzl macros instead of @rules_rs directly."
            exit 1
          fi
      - name: Check package READMEs
        run: tools/require_readme_test.sh
      - name: Check formatting
        run: bazel run $BB_FLAGS //:format.check
      - name: Test, build docs, and check coverage
        run: tools/coverage.sh $BB_FLAGS //...
      # The metrics step is best-effort: a failure here must not turn a
      # green build red. It also runs on failed builds so we keep
      # visibility into "the build failed because cache restore took 5
      # minutes" kinds of regressions.
      - name: Record CI metrics
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
        run: |
          bazel run $BB_FLAGS //tools/ci_health -- record \
            --run-id ${{ github.run_id }} \
            --job build \
            --out ci-metrics.json \
            ${{ github.event.pull_request.number && format('--pr {0}', github.event.pull_request.number) || '' }}
      - name: Upload CI metrics artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ci-metrics-${{ github.run_id }}
          path: ci-metrics.json
          retention-days: 90
          if-no-files-found: ignore
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      # The base image ships the deprecated gold linker, which causes warnings
      # when detected by build tools.  Remove the binaries; ld already points
      # to ld.bfd.
      - name: Remove deprecated gold linker
        run: sudo rm -f /usr/bin/x86_64-linux-gnu-ld.gold /usr/bin/ld.gold
      - name: Install Bazelisk
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86  # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-v2
          repository-cache: true
      - name: Deploy to GitHub Pages
        run: bazel run $BB_FLAGS //docs:deploy_docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
