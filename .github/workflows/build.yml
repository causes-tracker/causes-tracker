name: build
on:
  push:
    branches: [master]
  pull_request:
  merge_group:
permissions:
  contents: write
env:
  # BB_FLAGS travels with every CI bazel invocation. The --build_metadata
  # tags make BuildBuddy invocations searchable by GitHub run/PR/branch so
  # tooling can correlate BB stats back to a specific CI run without
  # having to capture per-invocation UUIDs. The literal-block scalar (|)
  # keeps each flag on its own line for readability and yamllint compliance;
  # shell word-splitting on $BB_FLAGS treats newlines as separators.
  BB_FLAGS: |
    --config=ci
    --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_ORG_API_KEY }}
    --build_metadata=GITHUB_RUN_ID=${{ github.run_id }}
    --build_metadata=GITHUB_RUN_ATTEMPT=${{ github.run_attempt }}
    --build_metadata=GITHUB_EVENT_NAME=${{ github.event_name }}
    --build_metadata=GITHUB_PR_NUMBER=${{ github.event.pull_request.number }}
    --build_metadata=GITHUB_BRANCH=${{ github.ref_name }}
    --build_metadata=GITHUB_JOB=${{ github.job }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      # The base image ships the deprecated gold linker, which causes warnings
      # when detected by build tools.  Remove the binaries; ld already points
      # to ld.bfd.
      - name: Remove deprecated gold linker
        run: sudo rm -f /usr/bin/x86_64-linux-gnu-ld.gold /usr/bin/ld.gold
      - name: Install Bazelisk
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86  # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-v2
          repository-cache: true
      - name: Run quality gates (lint, format, test, coverage)
        env:
          CHECK_TIMING_JSONL: ${{ github.workspace }}/check-timings.jsonl
        run: tools/check.sh ci $BB_FLAGS //...
      # Drain async BES uploads before the runner exits.
      - name: Drain BES uploads
        if: always()
        run: bazel shutdown
      - name: Upload per-gate timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: check-timings-${{ github.run_id }}
          path: check-timings.jsonl
          retention-days: 90
          if-no-files-found: warn
  # Runs on a checkout where Bazel never runs: buck2's file watcher follows the
  # bazel-* convenience symlinks into the output tree and hangs, so buck2 builds
  # cannot share a checkout with Bazel.
  buck2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - name: Install buckle
        run: sudo bash tools/buckle/install.sh /usr/local/bin
      - name: Install NativeLink
        run: sudo bash tools/nativelink/install.sh /usr/local/bin
      # Same opt-in mechanism as local dev (.buckconfig.local.template):
      # enables the BuildBuddy remote cache for the build below.
      - name: Enable BuildBuddy remote cache
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
        run: |
          sed "s/YOUR_KEY_HERE/${BUILDBUDDY_API_KEY}/" \
            .buckconfig.local.template > .buckconfig.local
      - name: Build buck2 targets
        run: buck2 build //...
      # A green cached build cannot distinguish "cache works" from
      # "permanently missing"; only a demonstrated hit proves the read path.
      # Killing the daemon after clean destroys all local state (buck-out and
      # the in-memory graph), so the required hits can only come from
      # BuildBuddy.
      - name: Verify remote cache round-trip
        run: |
          buck2 clean
          buck2 kill
          buck2 build //... 2>&1 | tee rebuild.log
          grep -q 'Cache hits: 100%' rebuild.log
      - name: Shut down buck2 daemon
        if: always()
        run: buck2 kill || true
  # Metrics collection runs as a separate job depending on `build` and
  # `buck2` so that their step logs are finalized by the time `record`
  # reads them. Inside a job, the GH logs endpoint 404s on the
  # presigned Azure blob until the job ends. The whole job is best-effort
  # (`if: always()` + `continue-on-error` per step) so a metrics failure
  # never turns a green build red, and metrics still get collected when
  # the build itself failed.
  ci-metrics:
    runs-on: ubuntu-latest
    needs: [build, buck2]
    if: always()
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - name: Remove deprecated gold linker
        run: sudo rm -f /usr/bin/x86_64-linux-gnu-ld.gold /usr/bin/ld.gold
      - name: Install Bazelisk
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86  # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-ci-metrics
          repository-cache: true
      - name: Download per-gate timings
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: check-timings-${{ github.run_id }}
          path: ${{ github.workspace }}
      # `--out` must be absolute: `bazel run` invokes the binary with cwd
      # inside the runfiles tree, not GITHUB_WORKSPACE, so a relative path
      # lands in `~/.cache/bazel/.../ci_health.runfiles/_main/` where
      # upload-artifact can't see it.
      # `--check-timings` is the JSONL produced by `tools/check.sh` under
      # `CHECK_TIMING_JSONL` in the `build` job, downloaded above.
      - name: Record CI metrics
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
        run: |
          bazel run $BB_FLAGS //tools/ci_health -- record \
            --run-id ${{ github.run_id }} \
            --job build \
            --out "${{ github.workspace }}/ci-metrics.json" \
            --check-timings "${{ github.workspace }}/check-timings.jsonl" \
            --buck2-job buck2 \
            ${{ github.event.pull_request.number && format('--pr {0}', github.event.pull_request.number) || '' }}
      - name: Upload CI metrics artifact
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ci-metrics-${{ github.run_id }}
          path: ci-metrics.json
          retention-days: 90
          if-no-files-found: ignore
      # Posts a marked comment on the PR only if this run is materially
      # slower or has worse cache behavior than the rolling baseline.
      # Silent on healthy runs. Best-effort: never fails the build.
      - name: Comment on PR if regressed
        if: always() && github.event_name == 'pull_request' && hashFiles('ci-metrics.json') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bazel run $BB_FLAGS //tools/ci_health -- pr-comment \
            --current "${{ github.workspace }}/ci-metrics.json" \
            --baseline-window 20 \
            --pr ${{ github.event.pull_request.number }}
      - name: Drain BES uploads
        if: always()
        run: bazel shutdown
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      # The base image ships the deprecated gold linker, which causes warnings
      # when detected by build tools.  Remove the binaries; ld already points
      # to ld.bfd.
      - name: Remove deprecated gold linker
        run: sudo rm -f /usr/bin/x86_64-linux-gnu-ld.gold /usr/bin/ld.gold
      - name: Install Bazelisk
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86  # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-v2
          repository-cache: true
      - name: Deploy to GitHub Pages
        run: bazel run $BB_FLAGS //docs:deploy_docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Drain BES uploads
        if: always()
        run: bazel shutdown
